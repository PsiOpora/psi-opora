name: Deploy to k3s

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "k3s/**"
      - "bun.lock"
      - ".github/workflows/deploy-k3s.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Какой сервис задеплоить (all — все сразу)"
        type: choice
        default: all
        options:
          - all
          - tg-bot
          - max-bot
          - tg-userbot-worker
          - bitrix-webhook
          - dashboard
          - clients

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - tg-bot
          - max-bot
          - tg-userbot-worker
          - bitrix-webhook
          - dashboard
          - clients
    # На workflow_dispatch с конкретным сервисом остальные элементы матрицы
    # просто скипаются (шаги ниже не выполняются, джоба зелёная).
    # Условие — на уровне шагов, а не джобы: matrix.* недоступен в
    # jobs.<id>.if, он вычисляется до разворачивания матрицы.

    steps:
      - name: Checkout
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.service == 'all' || github.event.inputs.service == matrix.service
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.service == 'all' || github.event.inputs.service == matrix.service
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.service == 'all' || github.event.inputs.service == matrix.service
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.service == 'all' || github.event.inputs.service == matrix.service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ vars.REGISTRY }}/psi-opora-${{ matrix.service }}:${{ github.sha }}
            ${{ vars.REGISTRY }}/psi-opora-${{ matrix.service }}:latest

      - name: Set up kubectl
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.service == 'all' || github.event.inputs.service == matrix.service
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.service == 'all' || github.event.inputs.service == matrix.service
        run: |
          mkdir -p "$HOME/.kube"
          # Секрет KUBECONFIG может быть как base64, так и обычным YAML —
          # раньше жёсткий base64 -d падал с "invalid input", если секрет
          # положили без кодирования.
          if echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config" 2>/dev/null; then
            echo "kubeconfig: декодирован из base64"
          else
            echo "${{ secrets.KUBECONFIG }}" > "$HOME/.kube/config"
            echo "kubeconfig: записан как обычный текст"
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Roll out new image
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.service == 'all' || github.event.inputs.service == matrix.service
        run: |
          kubectl set image "deployment/${{ matrix.service }}" \
            "${{ matrix.service }}=${{ vars.REGISTRY }}/psi-opora-${{ matrix.service }}:${{ github.sha }}" \
            -n psi-opora
          kubectl rollout status "deployment/${{ matrix.service }}" -n psi-opora --timeout=180s
