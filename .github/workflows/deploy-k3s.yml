name: Deploy to k3s

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "k3s/**"
      - "bun.lock"
      - ".github/workflows/deploy-k3s.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Какой сервис задеплоить (all — все сразу)"
        type: choice
        default: all
        options:
          - all
          - tg-bot
          - max-bot
          - tg-userbot-worker
          - hatchet-worker
          - bitrix-webhook
          - dashboard
          - clients

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: github.event_name == 'push'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: github.event_name == 'push'
        run: bun install

      - name: Detect affected services
        id: detect
        run: |
          ALL='["tg-bot","max-bot","tg-userbot-worker","hatchet-worker","bitrix-webhook","dashboard","clients"]'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICE="${{ github.event.inputs.service }}"
            if [ "$SERVICE" = "all" ]; then
              SERVICES="$ALL"
            else
              SERVICES="[\"$SERVICE\"]"
            fi
            echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
            echo "Запрошенный сервис: $SERVICES"
            exit 0
          fi

          # Изменения в лок-файле/package.json/turbo.json/самом workflow затрагивают
          # все сервисы разом — turbo не умеет вывести это из графа пакетов.
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^(bun\.lock|package\.json|turbo\.json|\.github/workflows/deploy-k3s\.yml)$'; then
            SERVICES="$ALL"
            echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
            echo "Изменился общий файл — деплоим все сервисы: $SERVICES"
            exit 0
          fi

          FROM="${{ github.event.before }}"
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$FROM" 2>/dev/null; then
            FROM="HEAD~1"
          fi

          if ! git cat-file -e "$FROM" 2>/dev/null; then
            SERVICES="$ALL"
            echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
            echo "Нет базы для сравнения — деплоим все сервисы: $SERVICES"
            exit 0
          fi

          # turbo знает граф зависимостей воркспейсов, поэтому изменение
          # пакета из packages/** корректно "поднимается" до app-пакетов,
          # которые от него зависят (--filter="...[from]").
          bunx turbo run typecheck --filter="...[$FROM]" --dry=json > turbo_out.json

          SERVICES=$(node -e "
            const apps = ['tg-bot','max-bot','tg-userbot-worker','hatchet-worker','bitrix-webhook','dashboard','clients'];
            const data = require('./turbo_out.json');
            const changed = (data.packages || [])
              .map(p => p.replace(/^@psi-opora\//, ''))
              .filter(p => apps.includes(p));
            console.log(JSON.stringify(changed));
          ")

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Затронутые сервисы: $SERVICES"

  infrastructure:
    name: Apply k3s manifests
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          if echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config" 2>/dev/null; then
            echo "kubeconfig: декодирован из base64"
          else
            echo "${{ secrets.KUBECONFIG }}" > "$HOME/.kube/config"
            echo "kubeconfig: записан как обычный текст"
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Check Redis password
        run: |
          VALUE=$(kubectl get secret psi-opora-env -n psi-opora \
            -o jsonpath='{.data.REDIS_PASSWORD}')
          if [ -z "$VALUE" ]; then
            echo "::error::В secret/psi-opora-env отсутствует REDIS_PASSWORD"
            exit 1
          fi

      - name: Check PostgreSQL secrets
        run: |
          for secret in postgres-credentials postgres-tls; do
            if ! kubectl get "secret/$secret" -n psi-opora >/dev/null 2>&1; then
              echo "::error::В namespace psi-opora отсутствует secret/$secret"
              exit 1
            fi
          done

      - name: Check Hatchet Cloud client token
        run: |
          VALUE=$(kubectl get secret psi-opora-env -n psi-opora \
            -o jsonpath='{.data.HATCHET_CLIENT_TOKEN}')
          if [ -z "$VALUE" ]; then
            echo "::error::secret/psi-opora-env не содержит HATCHET_CLIENT_TOKEN для Hatchet Cloud"
            exit 1
          fi

      - name: Check Clients Bitrix OAuth credentials
        if: contains(fromJSON(needs.changes.outputs.apps), 'clients')
        run: |
          for key in CLIENTS_BITRIX_CLIENT_ID CLIENTS_BITRIX_CLIENT_SECRET; do
            VALUE=$(kubectl get secret psi-opora-env -n psi-opora \
              -o "jsonpath={.data.${key}}" 2>/dev/null || true)
            if [ -z "$VALUE" ]; then
              echo "::error::secret/psi-opora-env не содержит $key для приложения clients"
              exit 1
            fi
          done

      - name: Apply PostgreSQL, Redis and application configuration
        run: |
          kubectl apply -f k3s/postgres.yaml
          kubectl apply -f k3s/redis.yaml
          kubectl apply -f k3s/hatchet-worker.yaml
          for service in tg-bot max-bot tg-userbot-worker hatchet-worker bitrix-webhook dashboard clients; do
            kubectl patch "deployment/$service" -n psi-opora --type=strategic \
              -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"$service\",\"envFrom\":[{\"secretRef\":{\"name\":\"psi-opora-env\"}},{\"configMapRef\":{\"name\":\"redis-connection\"}}]}]}}}}"
          done
          kubectl rollout status statefulset/postgres -n psi-opora --timeout=180s
          kubectl rollout status statefulset/redis -n psi-opora --timeout=120s

  deploy:
    name: Build & deploy ${{ matrix.service }}
    needs:
      - detect
      - infrastructure
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          # POSTGRES_URL нужен на этапе `next build` (dashboard, clients,
          # bitrix-webhook обращаются к БД при сборке страниц); для остальных
          # сервисов ARG в Dockerfile просто не объявлен и значение игнорируется.
          # NEXT_PUBLIC_BITRIX_WEBHOOK_APP_URL по той же причине — только
          # dashboard объявляет этот ARG (see apps/dashboard/Dockerfile).
          build-args: |
            POSTGRES_URL=${{ secrets.POSTGRES_URL }}
            NEXT_PUBLIC_BITRIX_WEBHOOK_APP_URL=${{ vars.NEXT_PUBLIC_BITRIX_WEBHOOK_APP_URL }}
          tags: |
            ${{ vars.REGISTRY }}/psi-opora-${{ matrix.service }}:${{ github.sha }}
            ${{ vars.REGISTRY }}/psi-opora-${{ matrix.service }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          # Секрет KUBECONFIG может быть как base64, так и обычным YAML —
          # раньше жёсткий base64 -d падал с "invalid input", если секрет
          # положили без кодирования.
          if echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config" 2>/dev/null; then
            echo "kubeconfig: декодирован из base64"
          else
            echo "${{ secrets.KUBECONFIG }}" > "$HOME/.kube/config"
            echo "kubeconfig: записан как обычный текст"
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Roll out new image
        run: |
          kubectl set image "deployment/${{ matrix.service }}" \
            "${{ matrix.service }}=${{ vars.REGISTRY }}/psi-opora-${{ matrix.service }}:${{ github.sha }}" \
            -n psi-opora
          kubectl rollout status "deployment/${{ matrix.service }}" -n psi-opora --timeout=180s
