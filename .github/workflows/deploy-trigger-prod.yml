name: Deploy Trigger.dev jobs (prod)

on:
  push:
    branches:
      - main
    paths:
      - "packages/jobs/**"
      - "packages/api/**"
      - "packages/db/**"
      - "packages/unisender-client/**"
      - "packages/bitrix-client/**"
      - "packages/bot-core/**"
      - "packages/config/**"
      - "bun.lock"
      - ".github/workflows/deploy-trigger-prod.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy jobs to Trigger.dev prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Read Trigger.dev SDK version
        id: trigger-sdk
        run: |
          VERSION=$(node -p 'require("./packages/jobs/package.json").dependencies["@trigger.dev/sdk"]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set Trigger project ref
        if: vars.TRIGGER_PROJECT_REF != ''
        run: echo "TRIGGER_PROJECT_REF=${{ vars.TRIGGER_PROJECT_REF }}" >> "$GITHUB_ENV"

      - name: Deploy to Trigger.dev prod
        working-directory: packages/jobs
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          bunx trigger.dev@${{ steps.trigger-sdk.outputs.version }} deploy \
            --env prod \
            --skip-update-check \
            --skip-sync-env-vars
