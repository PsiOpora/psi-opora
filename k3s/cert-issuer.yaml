# Требует установленный cert-manager (см. k3s/README.md, раздел "Свой реестр").
# ACME_EMAIL — замените на реальный email перед первым apply, туда Let's
# Encrypt шлёт уведомления об истечении сертификата.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
