apiVersion: apps/v1
kind: Deployment
metadata:
  name: hatchet-worker
  namespace: psi-opora
  labels:
    app: hatchet-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hatchet-worker
  template:
    metadata:
      labels:
        app: hatchet-worker
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: regcred
      containers:
        - name: hatchet-worker
          image: registry.orixon.ru/psi-opora-hatchet-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: psi-opora-env
            - configMapRef:
                name: redis-connection
          env:
            - name: REDIS_URL
              value: ""
            - name: HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED
              value: "true"
            - name: HATCHET_CLIENT_WORKER_HEALTHCHECK_PORT
              value: "8001"
          ports:
            - name: health
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
