# Хостер прописывает в /etc/resolv.conf ноды search-домен servarica.net, и
# kubelet копирует его во все поды. Апстрим на *.servarica.net отвечает
# SERVFAIL, а резолвер musl (Alpine) при SERVFAIL на любом search-домене
# прерывает весь поиск и возвращает EAI_NONAME ("bad address") — из-за этого
# поды не резолвили внешние адреса (Битрикс24), хотя с самой ноды всё работало.
# Мгновенный NXDOMAIN заставляет musl перейти к следующему кандидату.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  servarica.server: |
    servarica.net:53 {
      template ANY ANY {
        rcode NXDOMAIN
      }
    }
