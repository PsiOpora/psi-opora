apiVersion: apps/v1
kind: Deployment
metadata:
  name: max-userbot-worker
  namespace: psi-opora
  labels:
    app: max-userbot-worker
spec:
  replicas: 1
  # Держит одно постоянное TLS-соединение на аккаунт — два одновременно
  # работающих пода означают два конкурентных соединения с одной сессией,
  # поэтому Recreate вместо RollingUpdate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: max-userbot-worker
  template:
    metadata:
      labels:
        app: max-userbot-worker
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: max-userbot-worker
          image: registry.orixon.ru/psi-opora-max-userbot-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: psi-opora-env
            - configMapRef:
                name: redis-connection
          env:
            - name: REDIS_URL
              value: ""
            - name: LOG_LEVEL
              value: "error"
