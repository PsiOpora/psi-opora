apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: psi-opora
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          # REGISTRY_HOST — см. комментарий в k3s/tg-bot.yaml и k3s/README.md.
          image: REGISTRY_HOST:30500/psi-opora-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: psi-opora-env
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: psi-opora
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30010
