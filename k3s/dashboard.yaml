apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: psi-opora
  labels:
    app: dashboard
spec:
  replicas: 1
  # Новый под поднимается и проходит readinessProbe до того, как убьём
  # старый (maxSurge: 1) — трафик не прерывается на время выката.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      # Даём Traefik время убрать под из endpoints до отправки SIGTERM —
      # без этого часть запросов при выкате улетает в уже завершающийся под.
      # Next.js сам грациозно закрывает сервер по SIGTERM.
      terminationGracePeriodSeconds: 20
      imagePullSecrets:
        - name: regcred
      containers:
        - name: dashboard
          image: ghcr.io/kodermax/psi-opora-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: psi-opora-env
            - configMapRef:
                name: redis-connection
          env:
            - name: LOG_LEVEL
              value: "error"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: psi-opora
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30010
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashboard-http
  namespace: psi-opora
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`psi-opora-dashboard.orixon.ru`)
      kind: Rule
      services:
        - name: dashboard
          port: 3000
      middlewares:
        - name: redirect-to-https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashboard-https
  namespace: psi-opora
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`psi-opora-dashboard.orixon.ru`)
      kind: Rule
      services:
        - name: dashboard
          port: 3000
  tls:
    certResolver: letsencrypt
