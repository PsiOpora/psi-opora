# Логи всех подов psi-opora → Loki (хранилище) + Promtail (сборщик с каждой
# ноды) + Grafana (просмотр/история ошибок). Одноузловая установка Loki
# ("single binary", хранилище — локальный PVC), этого достаточно для истории
# логов на один сервер; распределённый Loki тут избыточен.

# --- Loki: хранилище логов ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: psi-opora
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    # 30 дней истории логов — компактор физически удаляет то, что старше.
    limits_config:
      retention_period: 720h

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: psi-opora
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: psi-opora
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:latest
          imagePullPolicy: IfNotPresent
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports:
            - containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: psi-opora
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100

---
# --- Promtail: DaemonSet, читает логи всех подов с диска ноды и шлёт в Loki ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: psi-opora
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: psi-opora
roleRef:
  kind: ClusterRole
  name: promtail
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: psi-opora
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # containerd (k3s по умолчанию) пишет логи в CRI-формате —
          # этот stage вытаскивает из него сам текст сообщения, поток и время.
          - cri: {}
        relabel_configs:
          # Только под'ы в нашем namespace — остальной кластер (kube-system
          # и т.п.) не собираем.
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: psi-opora
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - action: replace
            separator: /
            source_labels:
              [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: psi-opora
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/promtail/promtail-config.yaml"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: containers
              mountPath: /var/log/containers
              readOnly: true
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /run/promtail
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: containers
          hostPath:
            path: /var/log/containers
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: positions
          hostPath:
            path: /run/promtail
            type: DirectoryOrCreate

---
# --- Grafana: просмотр логов, дашборды, история ошибок ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: psi-opora
data:
  loki.yaml: |
    apiVersion: 1
    # Раньше datasource создавался без явного uid — Grafana сама сгенерировала
    # случайный и сохранила его в sqlite на PVC grafana-data. Простая замена
    # uid в файле провижининга не обновляет существующую запись (известный
    # баг Grafana — весь модуль provisioning падает с "data source not
    # found"), поэтому сначала явно удаляем старую запись по имени.
    deleteDatasources:
      - name: Loki
        orgId: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
---
# --- Дашборды Grafana: провижининг из ConfigMap, подхватываются при старте ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: psi-opora
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: psi-opora
        orgId: 1
        folder: psi-opora
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-errors
  namespace: psi-opora
data:
  psi-opora-errors.json: |
    {
      "title": "psi-opora — Ошибки и логи",
      "uid": "psi-opora-errors",
      "tags": ["psi-opora"],
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 39,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": "label_values({namespace=\"psi-opora\"}, app)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Ошибки в минуту по сервисам",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (app) (count_over_time({namespace=\"psi-opora\", app=~\"$service\"} |~ `(?i)error|exception|fatal|panic` [1m]))",
              "legendFormat": "{{app}}",
              "queryType": "range"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "tg-bot: ошибок за период",
          "gridPos": { "x": 0, "y": 8, "w": 4, "h": 4 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({namespace=\"psi-opora\", app=\"tg-bot\"} |~ `(?i)error|exception|fatal|panic` [$__range]))",
              "instant": true,
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "max-bot: ошибок за период",
          "gridPos": { "x": 4, "y": 8, "w": 4, "h": 4 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({namespace=\"psi-opora\", app=\"max-bot\"} |~ `(?i)error|exception|fatal|panic` [$__range]))",
              "instant": true,
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "tg-userbot-worker: ошибок за период",
          "gridPos": { "x": 8, "y": 8, "w": 4, "h": 4 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({namespace=\"psi-opora\", app=\"tg-userbot-worker\"} |~ `(?i)error|exception|fatal|panic` [$__range]))",
              "instant": true,
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "bitrix-webhook: ошибок за период",
          "gridPos": { "x": 12, "y": 8, "w": 4, "h": 4 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({namespace=\"psi-opora\", app=\"bitrix-webhook\"} |~ `(?i)error|exception|fatal|panic` [$__range]))",
              "instant": true,
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "dashboard: ошибок за период",
          "gridPos": { "x": 16, "y": 8, "w": 4, "h": 4 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({namespace=\"psi-opora\", app=\"dashboard\"} |~ `(?i)error|exception|fatal|panic` [$__range]))",
              "instant": true,
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "clients: ошибок за период",
          "gridPos": { "x": 20, "y": 8, "w": 4, "h": 4 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({namespace=\"psi-opora\", app=\"clients\"} |~ `(?i)error|exception|fatal|panic` [$__range]))",
              "instant": true,
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Логи с ошибками",
          "gridPos": { "x": 0, "y": 12, "w": 24, "h": 12 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{namespace=\"psi-opora\", app=~\"$service\"} |~ `(?i)error|exception|fatal|panic`",
              "queryType": "range"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: psi-opora
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: psi-opora
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-json
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards-json
          configMap:
            name: grafana-dashboard-errors
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: psi-opora
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-http
  namespace: psi-opora
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`psi-opora-grafana.orixon.ru`)
      kind: Rule
      services:
        - name: grafana
          port: 3000
      middlewares:
        - name: redirect-to-https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-https
  namespace: psi-opora
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`psi-opora-grafana.orixon.ru`)
      kind: Rule
      services:
        - name: grafana
          port: 3000
  tls:
    certResolver: letsencrypt
