# Логи всех подов psi-opora → Loki (хранилище) + Promtail (сборщик с каждой
# ноды) + Grafana (просмотр/история ошибок). Одноузловая установка Loki
# ("single binary", хранилище — локальный PVC), этого достаточно для истории
# логов на один сервер; распределённый Loki тут избыточен.

# --- Loki: хранилище логов ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: psi-opora
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    # 30 дней истории логов — компактор физически удаляет то, что старше.
    limits_config:
      retention_period: 720h

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: psi-opora
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: psi-opora
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:latest
          imagePullPolicy: IfNotPresent
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports:
            - containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: psi-opora
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100

---
# --- Promtail: DaemonSet, читает логи всех подов с диска ноды и шлёт в Loki ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: psi-opora
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: psi-opora
roleRef:
  kind: ClusterRole
  name: promtail
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: psi-opora
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # containerd (k3s по умолчанию) пишет логи в CRI-формате —
          # этот stage вытаскивает из него сам текст сообщения, поток и время.
          - cri: {}
        relabel_configs:
          # Только под'ы в нашем namespace — остальной кластер (kube-system
          # и т.п.) не собираем.
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: psi-opora
          # Логи самого стека мониторинга не отправляем в Loki: они создают
          # лишний шум и могут приводить к циклическим алертам.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: drop
            regex: grafana|loki|promtail
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - action: replace
            separator: /
            source_labels:
              [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: psi-opora
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/promtail/promtail-config.yaml"
          env:
            # Promtail 3.x по умолчанию сужает discovery до подов своей ноды
            # через field-селектор spec.nodeName=$HOSTNAME. Без этой
            # переменной HOSTNAME = имя пода (так делает k8s по умолчанию),
            # а не имя ноды — в итоге ни один под не находится (0/0 targets).
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: containers
              mountPath: /var/log/containers
              readOnly: true
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /run/promtail
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: containers
          hostPath:
            path: /var/log/containers
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: positions
          hostPath:
            path: /run/promtail
            type: DirectoryOrCreate

---
# --- Grafana: просмотр логов, дашборды, история ошибок ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: psi-opora
data:
  loki.yaml: |
    apiVersion: 1
    # Раньше datasource создавался без явного uid — Grafana сама сгенерировала
    # случайный и сохранила его в sqlite на PVC grafana-data. Простая замена
    # uid в файле провижининга не обновляет существующую запись (известный
    # баг Grafana — весь модуль provisioning падает с "data source not
    # found"), поэтому сначала явно удаляем старую запись по имени.
    deleteDatasources:
      - name: Loki
        orgId: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
---
# --- Дашборды Grafana: провижининг из ConfigMap, подхватываются при старте ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: psi-opora
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: psi-opora
        orgId: 1
        folder: psi-opora
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
# --- Grafana Alerting: ошибки из Loki → Telegram ---
#
# ВАЖНО: токен и chat_id намеренно хранятся прямо в этом файле по решению
# владельца проекта. Не публиковать этот манифест и репозиторий.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: psi-opora
data:
  psi-opora-alerting.yaml: |
    apiVersion: 1

    contactPoints:
      - orgId: 1
        name: psi-opora-telegram
        receivers:
          - uid: psi-opora-telegram
            type: telegram
            disableResolveMessage: false
            settings:
              bottoken: "8974638619:AAFvjwecyX7XEyRFMZvpH-XB-XCt0ssYt_0"
              chatid: "5652886641"
              parse_mode: HTML
              disable_web_page_preview: true
              message: |
                {{- if gt (len .Alerts.Firing) 0 }}
                🔴 <b>ОШИБКИ В PSI-OPORA</b>
                {{ range .Alerts.Firing }}
                Сервис: <code>{{ index .Labels "app" }}</code>
                Ошибок за 5 минут: <b>{{ index .Annotations "errors_count" }}</b>
                Текст ошибки:
                <pre>{{ printf "%.1200s" (index .Annotations "error_text") | html }}</pre>

                <a href="{{ .GeneratorURL }}">Открыть алерт в Grafana</a>
                {{ end }}
                {{- else }}
                ✅ <b>РАБОТА ВОССТАНОВЛЕНА</b>
                {{ range .Alerts.Resolved }}
                Сервис: <code>{{ index .Labels "app" }}</code>
                Ошибок больше нет.

                <a href="{{ .GeneratorURL }}">Открыть алерт в Grafana</a>
                {{ end }}
                {{- end }}

    policies:
      - orgId: 1
        receiver: psi-opora-telegram
        group_by:
          - grafana_folder
          - alertname
          - app
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

    groups:
      - orgId: 1
        name: pod-log-errors
        folder: psi-opora
        interval: 1m
        rules:
          - uid: psi-opora-pod-log-errors
            title: Ошибки в логах подов
            condition: C
            data:
              - refId: A
                queryType: instant
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: loki
                model:
                  datasource:
                    type: loki
                    uid: loki
                  editorMode: code
                  expr: >-
                    sum by (app, error_message) (count_over_time({namespace="psi-opora", app!~"grafana|loki|promtail"} |~ `(?i)error|exception|fatal|panic` | regexp `(?P<error_message>.*)` [5m]))
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  queryType: instant
                  refId: A
              - refId: B
                queryType: ""
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                queryType: ""
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Error
            for: 1m
            annotations:
              summary: Ошибки в логах {{ $labels.app }}
              description: За последние 5 минут найдено {{ $values.B.Value }} ошибок.
              errors_count: "{{ $values.B.Value }}"
              error_text: "{{ $labels.error_message }}"
            labels:
              severity: error
              source: pod-logs
            isPaused: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-errors
  namespace: psi-opora
data:
  psi-opora-errors.json: |
    {
      "title": "psi-opora — Ошибки и логи",
      "uid": "psi-opora-errors",
      "tags": ["psi-opora"],
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 39,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": "label_values({namespace=\"psi-opora\"}, app)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 9,
          "type": "logs",
          "title": "Все логи",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 10 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{namespace=\"psi-opora\", app=~\"$service\"}",
              "queryType": "range"
            }
          ]
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "Ошибки в минуту по сервисам",
          "gridPos": { "x": 0, "y": 10, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (app) (count_over_time({namespace=\"psi-opora\", app=~\"$service\"} |~ `(?i)error|exception|fatal|panic` [1m]))",
