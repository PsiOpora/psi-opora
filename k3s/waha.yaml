apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: waha-sessions
  namespace: psi-opora
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waha
  namespace: psi-opora
  labels:
    app: waha
spec:
  replicas: 1
  # Держит постоянные MTProto/WhatsApp-соединения (движок NOWEB) — Recreate,
  # как и у tg-userbot-worker.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: waha
  template:
    metadata:
      labels:
        app: waha
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: waha
          # Версию пиним сознательно: протокол WhatsApp неофициальный,
          # обновлять стоит вручную и осознанно (см. docker-compose.yml,
          # где запинена та же версия). Always — иначе при :latest нода
          # держит закэшированный образ и не видит новых сборок.
          image: devlikeapro/waha:latest-2026.8.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: WHATSAPP_DEFAULT_ENGINE
              value: NOWEB
            # После рестарта пода поднимать все ранее запущенные сессии.
            - name: WHATSAPP_RESTART_ALL_SESSIONS
              value: "True"
          envFrom:
            - secretRef:
                name: psi-opora-env
          # Без лимитов контейнер мог занять произвольно много CPU/RAM ноды
          # и остаться без предупреждения — сейчас держит ~380Mi в простое,
          # запас даём на пики при массовых сообщениях/переподключениях.
          resources:
            requests:
              cpu: 100m
              memory: 380Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # /ping не требует X-Api-Key (в отличие от /health) — пробы не
          # умеют брать заголовок из Secret, а хардкодить ключ в манифесте
          # не хотим. Задача проб — заметить зависший процесс, а не то, что
          # WA-сессии подключены (это отслеживается отдельно, через
          # session.status в вебхуке).
          startupProbe:
            httpGet:
              path: /ping
              port: 3000
            # WHATSAPP_RESTART_ALL_SESSIONS поднимает все сохранённые сессии
            # последовательно при старте — даём до 5 минут, прежде чем
            # считать под зависшим.
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /ping
              port: 3000
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: sessions
              mountPath: /app/.sessions
      volumes:
        - name: sessions
          persistentVolumeClaim:
            claimName: waha-sessions
---
apiVersion: v1
kind: Service
metadata:
  name: waha
  namespace: psi-opora
spec:
  type: NodePort
  selector:
    app: waha
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30050
