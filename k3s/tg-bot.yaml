apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg-bot
  namespace: psi-opora
  labels:
    app: tg-bot
spec:
  replicas: 1
  # Новый под поднимается и проходит readinessProbe до того, как убьём
  # старый (maxSurge: 1) — трафик не прерывается на время выката.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tg-bot
  template:
    metadata:
      labels:
        app: tg-bot
    spec:
      # Даём Traefik время убрать под из endpoints до отправки SIGTERM —
      # без этого часть запросов при выкате улетает в уже завершающийся под.
      terminationGracePeriodSeconds: 20
      imagePullSecrets:
        - name: regcred
      containers:
        - name: tg-bot
          # Тег latest тут только для первого bootstrap-apply — реальные
          # деплои катит GitHub Actions через kubectl set image.
          image: registry.orixon.ru/psi-opora-tg-bot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: psi-opora-env
          readinessProbe:
            httpGet:
              path: /api/webhook
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/webhook
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: tg-bot
  namespace: psi-opora
spec:
  type: ClusterIP
  selector:
    app: tg-bot
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tg-bot-http
  namespace: psi-opora
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`psi-opora-tg.orixon.ru`)
      kind: Rule
      services:
        - name: tg-bot
          port: 3000
      middlewares:
        - name: redirect-to-https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tg-bot-https
  namespace: psi-opora
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`psi-opora-tg.orixon.ru`)
      kind: Rule
      services:
        - name: tg-bot
          port: 3000
  tls:
    certResolver: letsencrypt
