apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg-userbot-worker
  namespace: psi-opora
  labels:
    app: tg-userbot-worker
spec:
  replicas: 1
  # Держит одно постоянное MTProto-соединение на аккаунт — два одновременно
  # работающих пода означают два конкурентных соединения с одной сессией,
  # поэтому Recreate вместо RollingUpdate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tg-userbot-worker
  template:
    metadata:
      labels:
        app: tg-userbot-worker
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: tg-userbot-worker
          image: registry.orixon.ru/psi-opora-tg-userbot-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: psi-opora-env
