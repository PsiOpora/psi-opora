apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitrix-webhook
  namespace: psi-opora
  labels:
    app: bitrix-webhook
spec:
  replicas: 1
  # Новый под поднимается и проходит readinessProbe до того, как убьём
  # старый (maxSurge: 1) — трафик не прерывается на время выката.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bitrix-webhook
  template:
    metadata:
      labels:
        app: bitrix-webhook
    spec:
      # Даём Traefik время убрать под из endpoints до отправки SIGTERM —
      # без этого часть запросов при выкате улетает в уже завершающийся под.
      terminationGracePeriodSeconds: 20
      imagePullSecrets:
        - name: regcred
      containers:
        - name: bitrix-webhook
          image: ghcr.io/psiopora/psi-opora-bitrix-webhook:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: psi-opora-env
            - configMapRef:
                name: redis-connection
          env:
            - name: LOG_LEVEL
              value: "error"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: bitrix-webhook
  namespace: psi-opora
spec:
  type: NodePort
  selector:
    app: bitrix-webhook
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30020
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bitrix-webhook-http
  namespace: psi-opora
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`psi-opora-bitrix-webhook.orixon.ru`)
      kind: Rule
      services:
        - name: bitrix-webhook
          port: 3000
      middlewares:
        - name: redirect-to-https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bitrix-webhook-https
  namespace: psi-opora
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`psi-opora-bitrix-webhook.orixon.ru`)
      kind: Rule
      services:
        - name: bitrix-webhook
          port: 3000
  tls:
    certResolver: letsencrypt
