# Hatchet control plane for the single-node psi-opora k3s cluster.
# Install with the pinned chart version documented in k3s/README.md.
sharedConfig:
  serverUrl: "http://hatchet-stack-api:8080"
  serverAuthCookieDomain: "localhost"
  serverAuthCookieInsecure: "t"
  grpcBroadcastAddress: "hatchet-stack-engine:7070"
  grpcInsecure: "t"
  env:
    SERVER_MSGQUEUE_KIND: "postgres"

api:
  replicaCount: 1
  quickstartJob:
    enabled: true
  workerTokenJob:
    enabled: true

engine:
  replicaCount: 1

frontend:
  enabled: true

postgres:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 10Gi
    extendedConfiguration: |
      timezone = 'UTC'

rabbitmq:
  enabled: false

caddy:
  enabled: false
