apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: psi-opora
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
# Конфиг zot (JSON, не env-переменные, как у registry:2) — путь до htpasswd
# ниже соответствует mountPath секрета registry-htpasswd в Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: psi-opora
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/registry"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "auth": {
          "htpasswd": {
            "path": "/etc/zot/secret/htpasswd"
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "policies": [
                {
                  "users": ["deploy"],
                  "actions": ["read", "create", "update", "delete"]
                }
              ],
              "defaultPolicy": ["read"]
            }
          }
        }
      },
      "log": {
        "level": "info"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: psi-opora
  labels:
    app: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: ghcr.io/project-zot/zot-linux-amd64:latest
          imagePullPolicy: IfNotPresent
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: config
              mountPath: /etc/zot/config.json
              subPath: config.json
              readOnly: true
            # Секрет registry-htpasswd создаётся вручную одной командой,
            # см. k3s/README.md — файл с паролями в git не хранится.
            # Пользователь в htpasswd должен называться "deploy" (или
            # поменяйте имя в accessControl выше на своё).
            - name: auth
              mountPath: /etc/zot/secret
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
        - name: config
          configMap:
            name: registry-config
        - name: auth
          secret:
            secretName: registry-htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: psi-opora
spec:
  type: ClusterIP
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
---
# Без TLS — трафик по http, домен только для имени, а не для сертификата.
# Докер-демону раннера и containerd на ноде k3s всё ещё нужно разрешить
# ходить сюда как insecure-registry, см. k3s/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  namespace: psi-opora
spec:
  ingressClassName: traefik
  rules:
    - host: registry.orixon.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  number: 5000
