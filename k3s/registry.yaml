apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: psi-opora
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
# Конфиг zot (JSON, не env-переменные, как у registry:2) — путь до htpasswd
# ниже соответствует mountPath секрета registry-htpasswd в Deployment.
# Retention: оставляет только тег latest, остальные теги удаляются при GC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: psi-opora
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": true,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h",
        "retention": {
          "dryRun": false,
          "delay": "24h",
          "policies": [
            {
              "repositories": ["**"],
              "deleteReferrers": true,
              "deleteUntagged": true,
              "keepTags": [
                {
                  "patterns": ["^latest$"]
                },
                {
                  "patterns": ["^[0-9a-f]{40}$"],
                  "pushedWithin": "168h"
                }
              ]
            }
          ]
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "auth": {
          "htpasswd": {
            "path": "/etc/zot/secret/htpasswd"
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "policies": [
                {
                  "users": ["deploy"],
                  "actions": ["read", "create", "update", "delete"]
                }
              ],
              "defaultPolicy": ["read"]
            }
          }
        }
      },
      "log": {
        "level": "info"
      },
       "extensions": {
        "search": {
          "enable": true
        },
        "ui": {
          "enable": true
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: psi-opora
  labels:
    app: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: ghcr.io/project-zot/zot-linux-amd64:latest
          imagePullPolicy: IfNotPresent
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: config
              mountPath: /etc/zot/config.json
              subPath: config.json
              readOnly: true
            # Секрет registry-htpasswd создаётся вручную одной командой,
            # см. k3s/README.md — файл с паролями в git не хранится.
            # Пользователь в htpasswd должен называться "deploy" (или
            # поменяйте имя в accessControl выше на своё).
            - name: auth
              mountPath: /etc/zot/secret
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
        - name: config
          configMap:
            name: registry-config
        - name: auth
          secret:
            secretName: registry-htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: psi-opora
spec:
  type: ClusterIP
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-http
  namespace: psi-opora
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`registry.orixon.ru`)
      kind: Rule
      services:
        - name: registry
          port: 5000
      middlewares:
        - name: redirect-to-https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-https
  namespace: psi-opora
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`registry.orixon.ru`)
      kind: Rule
      services:
        - name: registry
          port: 5000
  tls:
    certResolver: letsencrypt
