apiVersion: apps/v1
kind: Deployment
metadata:
  name: clients
  namespace: psi-opora
  labels:
    app: clients
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clients
  template:
    metadata:
      labels:
        app: clients
    spec:
      containers:
        - name: clients
          image: registry.orixon.ru/psi-opora-clients:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: psi-opora-env
---
apiVersion: v1
kind: Service
metadata:
  name: clients
  namespace: psi-opora
spec:
  type: NodePort
  selector:
    app: clients
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30005
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clients-http
  namespace: psi-opora
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`psi-opora-clients.orixon.ru`)
      kind: Rule
      services:
        - name: clients
          port: 3000
      middlewares:
        - name: redirect-to-https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clients-https
  namespace: psi-opora
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`psi-opora-clients.orixon.ru`)
      kind: Rule
      services:
        - name: clients
          port: 3000
  tls:
    certResolver: letsencrypt
