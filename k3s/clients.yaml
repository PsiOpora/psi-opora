apiVersion: apps/v1
kind: Deployment
metadata:
  name: clients
  namespace: psi-opora
  labels:
    app: clients
spec:
  replicas: 1
  # Новый под поднимается и проходит readinessProbe до того, как убьём
  # старый (maxSurge: 1) — трафик не прерывается на время выката.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: clients
  template:
    metadata:
      labels:
        app: clients
    spec:
      # Даём Traefik время убрать под из endpoints до отправки SIGTERM —
      # без этого часть запросов при выкате улетает в уже завершающийся под.
      # Next.js сам грациозно закрывает сервер по SIGTERM.
      terminationGracePeriodSeconds: 20
      imagePullSecrets:
        - name: regcred
      containers:
        - name: clients
          image: ghcr.io/kodermax/psi-opora-clients:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: psi-opora-env
            - configMapRef:
                name: redis-connection
          env:
            - name: LOG_LEVEL
              value: "error"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: clients
  namespace: psi-opora
spec:
  type: NodePort
  selector:
    app: clients
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30005
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: clients-attachment-body-limit
  namespace: psi-opora
spec:
  buffering:
    # 20 MiB файла + запас на multipart-заголовки. Traefik отклоняет тело до
    # передачи в Next.js, где file.size остаётся дополнительной проверкой.
    maxRequestBodyBytes: 22020096
    memRequestBodyBytes: 1048576
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clients-http
  namespace: psi-opora
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`psi-opora-clients.orixon.ru`)
      kind: Rule
      services:
        - name: clients
          port: 3000
      middlewares:
        - name: redirect-to-https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clients-https
  namespace: psi-opora
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`psi-opora-clients.orixon.ru`) && Path(`/api/attachments`) && Method(`POST`)
      kind: Rule
      priority: 100
      services:
        - name: clients
          port: 3000
      middlewares:
        - name: clients-attachment-body-limit
    - match: Host(`psi-opora-clients.orixon.ru`)
      kind: Rule
      services:
        - name: clients
          port: 3000
  tls:
    certResolver: letsencrypt
