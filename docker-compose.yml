services:
  bot:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env

  # Always-on процесс для личных Telegram-номеров (packages/tg-userbot,
  # apps/tg-userbot-worker) — держит постоянное MTProto-соединение,
  # поэтому не деплоится как serverless-функция (в отличие от apps/tg-bot
  # и apps/max-bot).
  tg-userbot-worker:
    build:
      context: .
      dockerfile: apps/tg-userbot-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env

  # Личные номера WhatsApp (packages/waha, роутеры whatsapp-personal) —
  # WAHA держит постоянные соединения с WhatsApp (движок NOWEB/Baileys),
  # наружу отдаёт REST API + вебхуки. Аналог tg-userbot-worker, только
  # готовый контейнер вместо нашего кода. Версию пиним сознательно:
  # протокол WhatsApp неофициальный, обновлять стоит вручную и осознанно.
  waha:
    image: devlikeapro/waha:2026.7
    restart: unless-stopped
    ports:
      - "${WAHA_PORT:-3050}:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY}
      # После рестарта контейнера поднимать все ранее запущенные сессии.
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-sessions:/app/.sessions

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/${MINIO_BACKUP_BUCKET:-crm-backups};
      exit 0;
      "

volumes:
  minio-data:
  waha-sessions:
