services:
  bot:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env

  # Always-on процесс для личных Telegram-номеров (packages/tg-userbot,
  # apps/tg-userbot-worker) — держит постоянное MTProto-соединение,
  # поэтому не деплоится как serverless-функция (в отличие от apps/tg-bot
  # и apps/max-bot).
  tg-userbot-worker:
    build:
      context: .
      dockerfile: apps/tg-userbot-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/${MINIO_BACKUP_BUCKET:-crm-backups};
      exit 0;
      "

volumes:
  minio-data:
